[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bursa-picker"
version = "0.1.0"
description = "Research-backed, explainable factor-based stock picker for Bursa Malaysia"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Dhiren", email = "mandhirensingh@gmail.com" }]
dependencies = [
  "yfinance>=0.2",
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "tqdm>=4.66",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "typer>=0.9",
  "rich>=13.7",
  "tenacity>=8.2",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-freezegun>=0.4",
  "matplotlib>=3.8",
]

[project.scripts]
bursa-picker = "bursa_picker.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["bursa_picker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
